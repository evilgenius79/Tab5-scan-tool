; =============================================================================
;  Tab5 Scan Tool - PlatformIO project configuration
; -----------------------------------------------------------------------------
;  Target : M5Stack Tab5  (ESP32-P4, dual-core RISC-V @ 360 MHz, 1280x720 DSI)
;  Adapter: OBDLink EX (FTDI-based USB CDC), connected to the Tab5 USB-A host.
;  Framework: ESP-IDF (>= 5.3) with LVGL 9 via esp_lvgl_port.
;
;  NOTE ON TOOLCHAIN
;  -----------------
;  ESP32-P4 support in the upstream `platformio/espressif32` platform is still
;  catching up. For reliable P4 + ESP-IDF 5.3 builds prefer the `pioarduino`
;  community fork (shown below) OR build natively with `idf.py`. The native
;  ESP-IDF build is driven by the root CMakeLists.txt in this repo, so both
;  workflows coexist:
;
;     idf.py set-target esp32p4
;     idf.py build flash monitor
;
; =============================================================================

[platformio]
default_envs = m5stack_tab5
; Native ESP-IDF places the entry component under main/; PlatformIO mirrors it.
src_dir = main

[env:m5stack_tab5]
; pioarduino fork tracks current ESP-IDF/Espressif targets incl. ESP32-P4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = espidf
board = esp32-p4-evboard          ; closest stock board def; pins overridden in app_config.h

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; PSRAM-backed LVGL framebuffers + large CAN ring buffers need the octal PSRAM.
board_build.psram_type = octal
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11
